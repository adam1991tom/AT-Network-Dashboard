name: AT Network Dashboard CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q app
      - name: Import application and initialise schema
        env:
          DATA_DIR: /tmp/at-network-dashboard
          AT_MASTER_KEY: CHANGE_ME
        run: |
          mkdir -p /tmp/at-network-dashboard
          python - <<'PY'
          from app.database import initialise
          initialise()
          import app.main
          print(app.main.VERSION)
          PY
      - name: Validate compose file
        run: |
          cp .env.example .env
          AT_PROJECT_DIR="$PWD" docker compose config >/dev/null
