services:
  at-network-dashboard:
    build: .
    container_name: at-network-dashboard-v2
    restart: unless-stopped
    ports:
      - "3082:3080"
    env_file:
      - .env
    volumes:
      - ./data:/data
      - /etc/localtime:/etc/localtime:ro
    security_opt:
      - no-new-privileges:true

  at-network-updater:
    build:
      context: .
      dockerfile: updater/Dockerfile
    container_name: at-network-dashboard-updater
    restart: unless-stopped
    depends_on:
      - at-network-dashboard
    environment:
      AT_PROJECT_DIR: ${AT_PROJECT_DIR:-/opt/AT-Network-Dashboard}
    volumes:
      - ./:${AT_PROJECT_DIR:-/opt/AT-Network-Dashboard}
      - ./data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    security_opt:
      - no-new-privileges:true
