services:
  at-network-dashboard:
    build: .
    container_name: at-network-dashboard-v2
    restart: unless-stopped
    ports:
      - "3082:3080"
    env_file:
      - .env
    volumes:
      - ./data:/data
      - /etc/localtime:/etc/localtime:ro
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # Mirrors the image's own HEALTHCHECK (Dockerfile) - made explicit here so
      # every service's health signal is visible in one place.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3080/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    mem_limit: 512m
    cpus: 1.0

  at-network-speedtest:
    build: .
    container_name: at-network-dashboard-speedtest
    restart: unless-stopped
    depends_on:
      - at-network-dashboard
    command: ["python", "-m", "app.auto_speedtest"]
    env_file:
      - .env
    volumes:
      - ./data:/data
      - /etc/localtime:/etc/localtime:ro
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # Overrides the image's HTTP HEALTHCHECK, which is meaningless here since this
      # container runs the poller loop only and never starts a web server.
      test: ["CMD-SHELL", "test $$(( $$(date +%s) - $$(stat -c %Y /data/speedtest-heartbeat 2>/dev/null || echo 0) )) -lt 60"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    mem_limit: 256m
    cpus: 0.5

  at-network-updater:
    build:
      context: .
      dockerfile: updater/Dockerfile
    container_name: at-network-dashboard-updater
    restart: unless-stopped
    depends_on:
      - at-network-dashboard
    environment:
      AT_PROJECT_DIR: ${AT_PROJECT_DIR:-/opt/AT-Network-Dashboard}
    volumes:
      - ./:${AT_PROJECT_DIR:-/opt/AT-Network-Dashboard}
      - ./data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # No HTTP surface - confirms the daemon socket is actually reachable,
      # which is this container's one job.
      test: ["CMD-SHELL", "test -S /var/run/docker.sock && docker version >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    mem_limit: 256m
    cpus: 0.5

  shell-agent:
    build: ./shell-agent
    container_name: at-network-dashboard-shell-agent
    restart: unless-stopped
    # Runs commands on the real host, not in a container - it joins PID 1's
    # namespaces via nsenter, which needs both of these. No published port:
    # only reachable from other containers on this compose network, same as
    # docker-agent below. This plus the token auth and the denylist in
    # app.py are the only things standing between "the AI can fix things on
    # the server" and arbitrary code execution reachable from the LAN -
    # keep all three.
    pid: host
    privileged: true
    environment:
      AGENT_TOKEN: ${SHELL_AGENT_TOKEN}
      AGENT_HOST_LABEL: newtiny
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8299/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    mem_limit: 128m
    cpus: 0.25

  docker-agent:
    build: ./docker-agent
    container_name: at-network-dashboard-docker-agent
    restart: unless-stopped
    # No published port: only reachable from other containers on this
    # compose network (the main app calls it as http://docker-agent:8199).
    # This is the only container with Docker socket access that also has
    # write (start/stop/restart) capability, so keeping it off the LAN
    # entirely - not just off the public internet - is the point.
    environment:
      AGENT_TOKEN: ${DOCKER_AGENT_TOKEN}
      AGENT_HOST_LABEL: newtiny
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8199/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    mem_limit: 128m
    cpus: 0.25
