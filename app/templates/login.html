<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login · AT Network Dashboard</title><link rel="stylesheet" href="/static/app.css"><link rel="stylesheet" href="/static/unifi-inspired.css"></head><body><main class="auth-shell"><section class="card auth-card"><div class="brand-line"><span class="health-dot"></span><h1>AT Network Dashboard</h1></div><p class="muted">Administrator sign in</p><label>Username<input id="username" autocomplete="username"></label><label>Password<input id="password" type="password" autocomplete="current-password"></label><button class="primary-button" id="login">Sign In</button><div class="test-status" id="status"></div></section></main><script>async function go(){const s=document.getElementById('status');s.textContent='Signing in…';const r=await fetch('/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:username.value,password:password.value})});const j=await r.json().catch(()=>({}));if(r.ok&&j.ok){location.href='/dashboard'}else{s.textContent=j.message||'Login failed';s.className='test-status bad'}}document.getElementById('login').onclick=go;document.getElementById('password').addEventListener('keydown',e=>{if(e.key==='Enter')go()});</script></body></html>
