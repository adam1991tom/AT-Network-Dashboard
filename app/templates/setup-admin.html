<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administrator Setup · AT Network Dashboard</title><script src="/static/theme.js"></script><link rel="stylesheet" href="/static/app.css"><link rel="stylesheet" href="/static/unifi-inspired.css"><link rel="stylesheet" href="/static/auth.css"></head><body><main class="auth-shell"><section class="card auth-card"><div class="brand-line"><span class="health-dot"></span><h1>Create Administrator</h1></div><p class="muted">Protect this installation before continuing.</p><label>Username<input id="username" autocomplete="username"></label><label>Password<input id="password" type="password" autocomplete="new-password" placeholder="At least 10 characters"></label><label>Confirm password<input id="confirm_password" type="password" autocomplete="new-password"></label><button class="primary-button" id="create">Create Administrator</button><div class="test-status" id="status"></div></section></main><script>async function go(){const s=document.getElementById('status'),usernameValue=username.value.trim(),passwordValue=password.value,confirmValue=confirm_password.value;if(passwordValue!==confirmValue){s.textContent='Passwords do not match';s.className='test-status bad';return}if(!usernameValue){s.textContent='Enter a username';s.className='test-status bad';return}if(passwordValue.length<10){s.textContent='Password must be at least 10 characters';s.className='test-status bad';return}s.textContent='Creating…';s.className='test-status testing';try{const r=await fetch('/setup-admin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:usernameValue,password:passwordValue})});const j=await r.json().catch(()=>({}));if(r.ok&&j.ok){location.href='/login'}else{s.textContent=j.message||'Setup failed';s.className='test-status bad'}}catch(error){s.textContent='Setup failed: '+error;s.className='test-status bad'}}create.onclick=go;confirm_password.addEventListener('keydown',e=>{if(e.key==='Enter')go()});</script></body></html>
