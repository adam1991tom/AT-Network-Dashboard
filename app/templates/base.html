<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} · AT Network Dashboard</title>
  <link rel="stylesheet" href="/static/app.css">
  <link rel="stylesheet" href="/static/unifi-inspired.css">
  <link rel="stylesheet" href="/static/polish.css">
  <link rel="stylesheet" href="/static/dev11.css">
</head>
<body>
  <div class="app-frame">
    <aside class="app-rail" aria-label="Primary navigation">
      <a class="rail-brand" href="/dashboard" title="AT Network Dashboard"><span class="rail-dot"></span><span class="rail-brand-text">AT</span></a>
      <nav class="rail-nav">
        <a class="rail-link {% if page == 'dashboard' %}active{% endif %}" href="/dashboard" title="Dashboard"><span class="rail-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg></span><small>Dashboard</small></a>
        <a class="rail-link {% if page == 'incidents' %}active{% endif %}" href="/incidents" title="Incidents"><span class="rail-icon"><svg viewBox="0 0 24 24"><path d="M12 3 2.8 20h18.4L12 3Z"/><path d="M12 9v5"/><circle cx="12" cy="17" r=".7"/></svg></span><small>Incidents</small></a>
        <a class="rail-link {% if page == 'wifi' %}active{% endif %}" href="/wifi" title="Wi-Fi"><span class="rail-icon"><svg viewBox="0 0 24 24"><path d="M4 9a12 12 0 0 1 16 0"/><path d="M7 12a8 8 0 0 1 10 0"/><path d="M10 15a4 4 0 0 1 4 0"/><circle cx="12" cy="18" r="1"/></svg></span><small>Wi-Fi</small></a>
        <a class="rail-link {% if page == 'reports' %}active{% endif %}" href="/reports" title="Reports"><span class="rail-icon"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg></span><small>Reports</small></a>
      </nav>
      <nav class="rail-nav rail-nav-bottom">
        <a class="rail-link {% if page == 'settings' %}active{% endif %}" href="/settings" title="Settings"><span class="rail-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1l2-1.5-2-3.5-2.4 1a7 7 0 0 0-1.7-1L14.5 3h-5L9.2 6a7 7 0 0 0-1.7 1L5 6 3 9.5 5.1 11a7 7 0 0 0 0 2L3 14.5 5 18l2.5-1a7 7 0 0 0 1.7 1l.3 3h5l.3-3a7 7 0 0 0 1.7-1l2.5 1 2-3.5-2.1-1.5a7 7 0 0 0 .1-1Z"/></svg></span><small>Settings</small></a>
        <button class="rail-link rail-button" id="logout_button_rail" type="button" title="Logout"><span class="rail-icon"><svg viewBox="0 0 24 24"><path d="M10 5H5v14h5"/><path d="M13 8l4 4-4 4"/><path d="M8 12h9"/></svg></span><small>Logout</small></button>
      </nav>
    </aside>
    <div class="app-workspace">
      <header class="topbar">
        <div class="brand-wrap"><div class="brand-line"><span class="health-dot"></span><div class="brand">AT Network Dashboard</div></div><div class="subtitle">Network · ISP · Wi-Fi · Power</div></div>
        <div class="topbar-context"><span class="context-label">{{ title }}</span><span class="context-version">{{ version }}</span></div>
        <nav class="nav">
          <a class="{% if page == 'dashboard' %}active{% endif %}" href="/dashboard">Dashboard</a>
          <a class="{% if page == 'incidents' %}active{% endif %}" href="/incidents">Incidents</a>
          <a class="{% if page == 'wifi' %}active{% endif %}" href="/wifi">Wi-Fi</a>
          <a class="{% if page == 'reports' %}active{% endif %}" href="/reports">Reports</a>
          <a class="{% if page == 'settings' %}active{% endif %}" href="/settings">Settings</a>
          <button class="nav-logout" id="logout_button_top" type="button">Logout</button>
        </nav>
      </header>
      <main class="page-shell">{% block content %}{% endblock %}</main>
      <footer class="footer">AT Network Dashboard {{ version }}</footer>
    </div>
  </div>
<script>
async function atLogout(){try{await fetch('/logout',{method:'POST'});}catch(e){}location.href='/login';}
document.getElementById('logout_button_rail')?.addEventListener('click',atLogout);document.getElementById('logout_button_top')?.addEventListener('click',atLogout);
</script>
<script src="/static/dev13.js"></script>
</body>
</html>
