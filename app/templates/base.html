<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} · AT Network Dashboard</title>
  <link rel="stylesheet" href="/static/app.css">
  <link rel="stylesheet" href="/static/unifi-inspired.css">
</head>
<body>
  <div class="app-frame">
    <aside class="app-rail" aria-label="Primary navigation">
      <a class="rail-brand" href="/dashboard" title="AT Network Dashboard"><span class="rail-dot"></span><span class="rail-brand-text">AT</span></a>
      <nav class="rail-nav">
        <a class="rail-link {% if page == 'dashboard' %}active{% endif %}" href="/dashboard" title="Dashboard"><span>◉</span><small>Home</small></a>
        <a class="rail-link {% if page == 'incidents' %}active{% endif %}" href="/incidents" title="Incidents"><span>◇</span><small>Incidents</small></a>
        <a class="rail-link {% if page == 'wifi' %}active{% endif %}" href="/wifi" title="Wi-Fi"><span>⌁</span><small>Wi-Fi</small></a>
        <a class="rail-link {% if page == 'reports' %}active{% endif %}" href="/reports" title="Reports"><span>▥</span><small>Reports</small></a>
      </nav>
      <nav class="rail-nav rail-nav-bottom">
        <a class="rail-link {% if page == 'settings' %}active{% endif %}" href="/settings" title="Settings"><span>⚙</span><small>Settings</small></a>
      </nav>
    </aside>
    <div class="app-workspace">
      <header class="topbar">
        <div class="brand-wrap">
          <div class="brand-line"><span class="health-dot"></span><div class="brand">AT Network Dashboard</div></div>
          <div class="subtitle">Network · ISP · Wi-Fi · Power</div>
        </div>
        <div class="topbar-context"><span class="context-label">{{ title }}</span><span class="context-version">{{ version }}</span></div>
        <nav class="nav">
          <a class="{% if page == 'dashboard' %}active{% endif %}" href="/dashboard">Dashboard</a>
          <a class="{% if page == 'incidents' %}active{% endif %}" href="/incidents">Incidents</a>
          <a class="{% if page == 'wifi' %}active{% endif %}" href="/wifi">Wi-Fi</a>
          <a class="{% if page == 'reports' %}active{% endif %}" href="/reports">Reports</a>
          <a class="{% if page == 'settings' %}active{% endif %}" href="/settings">Settings</a>
        </nav>
      </header>
      <main class="page-shell">{% block content %}{% endblock %}</main>
      <footer class="footer">AT Network Dashboard {{ version }}</footer>
    </div>
  </div>
</body>
</html>
